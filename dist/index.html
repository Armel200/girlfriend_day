t=crop&h=627&w=1200",caption:"Chaque instant avec toi est magique"},{id:4,title:"Et si c'était le plus beau trésor ?",message:"J'ai ouvert tous les coffres, marché sur tous les chemins, et le plus beau trésor n'était ni l'or ni les pierres précieuses… C'était toi. Toi, exactement comme tu es. Alors voici ma promesse : tant que je vivrai, je t'aimerai. C'est la seule fin que je veux pour notre histoire.",photo:"https://images.pexels.com/photos/6410240/pexels-photo-6410240.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",caption:"Le trésor, c'est nous"}],Rh=[{url:"https://images.pexels.com/photos/22938527/pexels-photo-22938527.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",caption:"Notre premier baiser",date:"14 février",rot:-3},{url:"https://images.pexels.com/photos/29564805/pexels-photo-29564805.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",caption:"Mains unies, toujours",date:"1er juin",rot:2},{url:"https://images.pexels.com/photos/14839222/pexels-photo-14839222.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",caption:"Ce soir-là, sous le ciel",date:"21 août",rot:-2},{url:"https://images.pexels.com/photos/15497271/pexels-photo-15497271.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",caption:"Un éternel instant",date:"3 octobre",rot:3},{url:"https://images.pexels.com/photos/6410240/pexels-photo-6410240.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",caption:"L'amour au coucher du soleil",date:"24 décembre",rot:-1},{url:"https://images.pexels.com/photos/14839193/pexels-photo-14839193.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",caption:"Et puis, l'éternité",date:"À jamais",rot:2}],v1=[{id:0,title:"Lettre n°1 — À la personne qui a changé ma vie",salutation:"Mon amour, mon tout,",body:["Si quelqu'un m'avait dit, il y a quelques années, que le simple fait de penser à toi pouvait illuminer une journée entière, je ne l'aurais pas cru. Et pourtant, te voilà, bouleversant chacune de mes certitudes avec un simple sourire.","Tu es la mélodie que je fredonne sans m'en rendre compte, le rêve dont je ne veux jamais me réveiller, la raison pour laquelle les mots « toujours » ont enfin un sens.","Je t'aime, pas seulement pour ce que tu es, mais pour ce que je deviens quand tu me regardes."],sign:"À toi, pour toujours — Ton âme sœur"},{id:1,title:"Lettre n°2 — Les petits riens qui sont tout",salutation:"Ma douce moitié,",body:["Ce ne sont pas les grands gestes qui font notre histoire, mais les petits riens : ton rire au milieu de la nuit, nos silences confortables, la façon dont tu poses ta tête sur mon épaule après une longue journée.","J'ai collectionné chacun de ces instants comme d'autres collectionnent les étoiles. Et crois-moi, mon ciel est si plein qu'il ne connaîtra jamais la nuit.","Merci d'exister. Merci d'être toi. Merci de m'avoir choisi(e)."],sign:"Tendrement, éternellement — Ton amoureux(se)"},{id:2,title:"Lettre n°3 — Promesse pour demain",salutation:"À celui/celle qui fait battre mon cœur,",body:["Je ne sais pas où la route nous mènera, mais je sais une chose : je veux la parcourir à tes côtés. À travers les doutes, les rires, les larmes et les victoires.","Je te promets de choisir notre amour chaque matin, même les jours où ce sera difficile. Je te promets de te regarder avec les mêmes yeux émerveillés du premier jour. Je te promets de vieillir avec toi, main dans la main, en nous rappelant que tout a commencé par une simple histoire écrite par deux cœurs.","Et si le destin s'amuse à nous tester, qu'il sache que nous sommes invincibles. Parce que nous, c'est pour la vie."],sign:"Éternellement vôtre — Ton autre moitié"}],Ph="Et ils vécurent heureux…",qh="L'aventure touche à sa fin, mais notre histoire, elle, ne fait que commencer. Chaque coffre ouvert, chaque pas sur ce sentier enchanté n'était qu'une métaphore de notre voyage : semé d'embûches, mais toujours illuminé par l'amour. Merci d'être mon/ma co-aventurier·ère pour l'éternité. Je t'aime. ❤️",Mh={1:[[1,1]],2:[[0,2],[2,0]],3:
